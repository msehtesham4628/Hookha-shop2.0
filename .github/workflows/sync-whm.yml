name: Sync World Hookah Market Catalog

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/server/scripts/reconcile-whm-batched.mjs'
      - '.github/workflows/sync-whm.yml'
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Rebuild and validate WHM catalog
        run: npm run sync:whm:reconcile
      - name: Commit catalog changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server/db/scrapedProducts.json src/server/db/scrapedCategories.json src/server/db/scrapedBrands.json src/server/db/worldhookahmarket-sync.json
          git diff --cached --quiet || git commit -m 'chore: rebuild WHM catalog with verified product images'
          git push
