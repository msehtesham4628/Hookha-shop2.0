name: Sync World Hookah Market Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync WHM catalog
        run: npm run sync:whm

      - name: Commit catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server/db/scrapedProducts.json src/server/db/scrapedCategories.json src/server/db/scrapedBrands.json src/server/db/worldhookahmarket-sync.json
          git diff --cached --quiet || git commit -m 'chore: sync World Hookah Market catalog'
          git push
