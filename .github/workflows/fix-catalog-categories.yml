# Catalog classification repair workflow
name: Fix catalog category matching

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[catalog-category-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch category matching
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/server/db/store.ts')
          s = p.read_text()
          old = """        const categoryText = catalogText(rawProduct.category);\n        const productText = `${name} ${sourceUrl.replace(/^https?:\\/\\/[^/]+/i, '')}`;\n        const category = categoryText || (/e-?hookah|electronic hookah|hookah pod/i.test(productText) ? 'E-Hookah' : /vape|puff|nicotine|pod system|disposable/i.test(productText) ? 'Vapes' : /charcoal|coconut coal|quick light/i.test(productText) ? 'Coal' : /tobacco|shisha|molasses/i.test(productText) ? 'Tobacco' : /bowl|phunnel|clay bowl/i.test(productText) ? 'Bowls' : /base|glass vase|vase for hookah/i.test(productText) ? 'Bases' : /hookah|shisha pipe|nargile/i.test(productText) ? 'Hookahs' : 'Accessories');"""
          new = """        const categoryText = catalogText(rawProduct.category);\n        const productText = `${name} ${catalogText(rawProduct.description)} ${sourceUrl.replace(/^https?:\\/\\/[^/]+/i, '')}`.toLowerCase();\n        const category =\n          /e-?hookah|electronic hookah|smart head|hookah pod/.test(productText) ? 'E-Hookah' :\n          /vape|puff|nicotine|pod system|disposable/.test(productText) ? 'Vapes' :\n          /charcoal|coconut coal|quick light|hookah coal|hookah charcoal/.test(productText) ? 'Coal' :\n          /tobacco|shisha tobacco|hookah tobacco|molasses|dark leaf|blonde leaf|cigar leaf/.test(productText) ? 'Tobacco' :\n          /\\bbowls?\\b|phunnel|killer bowl|hookah bowl|clay bowl/.test(productText) ? 'Bowls' :\n          /\\bbases?\\b|glass vase|vase for hookah|crystal base|hookah base/.test(productText) ? 'Bases' :\n          /\\bhookahs?\\b|shisha pipe|nargile|hookah stem|hookah set/.test(productText) ? 'Hookahs' :\n          categoryText || 'Accessories';"""
          if old in s:
              p.write_text(s.replace(old, new, 1))

          p = Path('scripts/import-clean-catalog.mjs')
          s = p.read_text()
          old = """const category = p => {\n  const explicit = text(p.category);\n  if (explicit) return explicit;\n  const s = `${p.product_name || ''} ${p.product_url || ''}`.toLowerCase();\n  if (/e-?hookah|electronic hookah|hookah pod/.test(s)) return 'E-Hookah';\n  if (/vape|puff|nicotine|pod system|disposable/.test(s)) return 'Vapes';\n  if (/charcoal|coconut coal|quick light/.test(s)) return 'Coal';\n  if (/tobacco|shisha|molasses/.test(s)) return 'Tobacco';\n  return 'Accessories';\n};"""
          new = """const category = p => {\n  const explicit = text(p.category);\n  const s = `${p.product_name || ''} ${p.description || ''} ${p.product_url || ''}`.toLowerCase();\n  if (/e-?hookah|electronic hookah|smart head|hookah pod/.test(s)) return 'E-Hookah';\n  if (/vape|puff|nicotine|pod system|disposable/.test(s)) return 'Vapes';\n  if (/charcoal|coconut coal|quick light|hookah coal|hookah charcoal/.test(s)) return 'Coal';\n  if (/tobacco|shisha tobacco|hookah tobacco|molasses|dark leaf|blonde leaf|cigar leaf/.test(s)) return 'Tobacco';\n  if (/\\bbowls?\\b|phunnel|killer bowl|hookah bowl|clay bowl/.test(s)) return 'Bowls';\n  if (/\\bbases?\\b|glass vase|vase for hookah|crystal base|hookah base/.test(s)) return 'Bases';\n  if (/\\bhookahs?\\b|shisha pipe|nargile|hookah stem|hookah set/.test(s)) return 'Hookahs';\n  return explicit || 'Accessories';\n};"""
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/server/routes/misc.routes.ts')
          s = p.read_text()
          start = s.index('const normalizeCatalogSlug')
          end = s.index('// GET /api/categories', start)
          block = r'''const normalizeCatalogSlug = (value: unknown) => String(value ?? '')
            .trim()
            .toLowerCase()
            .replace(/&/g, ' and ')
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-|-$/g, '');

          const CATEGORY_ALIASES: Record<string, string[]> = {
            tobacco: ['tobacco', 'hookah-tobacco', 'shisha-tobacco', 'shisha'],
            hookahs: ['hookah', 'hookahs', 'water-pipe', 'water-pipes'],
            bowls: ['bowl', 'bowls', 'hookah-bowl', 'hookah-bowls'],
            bases: ['base', 'bases', 'hookah-base', 'hookah-bases', 'vase', 'vases'],
            coal: ['coal', 'coals', 'charcoal', 'charcoals', 'hookah-coal', 'hookah-charcoal'],
            accessories: ['accessory', 'accessories', 'hookah-accessories'],
            'e-hookah': ['e-hookah', 'e-hookah-electronic', 'electronic-hookah', 'electronic-hookahs'],
            vapes: ['vape', 'vapes', 'vape-pod', 'vape-pods', 'pod-systems', 'disposable-vapes']
          };

          const productCategoryValues = (product: any): string[] => Array.from(new Set([
            product?.categorySlug,
            product?.category,
            product?.categoryName,
            product?.productCategory
          ].filter(Boolean).map(normalizeCatalogSlug)));

          const productMatchesCategory = (product: any, category: Category) => {
            if (!product?.isActive) return false;
            const requested = new Set<string>([
              normalizeCatalogSlug(category.slug),
              normalizeCatalogSlug(category.name)
            ].filter(Boolean));
            const canonical = normalizeCatalogSlug(category.slug || category.name);
            for (const alias of CATEGORY_ALIASES[canonical] || []) requested.add(normalizeCatalogSlug(alias));
            const values = productCategoryValues(product);
            return values.some(value => requested.has(value));
          };

          const getStorefrontCategories = (): Category[] => {
            const categories = [...db.categories];
            const existing = new Set(categories.map(c => normalizeCatalogSlug(c.slug)));
            const discovered = new Map<string, string>();
            for (const product of db.products) {
              if (!product?.isActive) continue;
              const rawName = String(product.category || product.categoryName || '').trim();
              const rawSlug = String(product.categorySlug || rawName).trim();
              const slug = normalizeCatalogSlug(rawSlug);
              if (!slug || discovered.has(slug)) continue;
              discovered.set(slug, rawName || slug.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase()));
            }
            for (const [slug, name] of discovered) {
              if (existing.has(slug)) continue;
              categories.push({
                id: `cat-${slug}`,
                name,
                slug,
                description: `${name} from the Fumare Hookah catalog.`,
                subcategories: [],
                productCount: 0,
                isActive: true,
                sortOrder: 100 + categories.length
              });
              existing.add(slug);
            }
            return categories;
          };

          '''
          p.write_text(s[:start] + block + s[end:])
          PY

      - name: Commit catalog fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/db/store.ts scripts/import-clean-catalog.mjs src/server/routes/misc.routes.ts .github/workflows/fix-catalog-categories.yml
          git diff --cached --quiet || git commit -m "fix: classify catalog products from full product text [catalog-category-fixed]"
          git push
