name: Fix persistence cold boot and admin catalog refresh

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[persistence-cold-boot-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch persistence initialization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/server/db/store.ts')
          s = p.read_text()

          s = s.replace(
              "  private isInitialized = false;\n",
              "  private isInitialized = false;\n  public ready: Promise<void>;\n",
              1
          )

          s = s.replace(
              "  constructor() {\n    this.seedDefaultUsers();\n    this.init();\n  }",
              "  constructor() {\n    // Load durable tombstones before seeding any built-in users.\n    this.loadPersistence();\n    this.seedDefaultUsers();\n    this.ready = this.init();\n  }",
              1
          )

          marker = "    this.users = [\n"
          # Add deletion filtering immediately after the default-user array is assigned.
          old_end = """      }\n    ];\n  }\n\n  public async init() {"""
          new_end = """      }\n    ];\n\n    // Never resurrect a user whose deletion is recorded in durable persistence.\n    const deletedUserSet = new Set((this.persistenceData.deletedUserIds || []).map(id => id.toLowerCase().trim()));\n    this.users = this.users.filter(u => !deletedUserSet.has(u.id.toLowerCase().trim()));\n  }\n\n  public async init() {"""
          if old_end not in s:
              raise SystemExit('seedDefaultUsers assignment boundary not found')
          s = s.replace(old_end, new_end, 1)

          # init() must not re-seed the defaults after persistence has been loaded.
          s = s.replace("\n    this.seedDefaultUsers();\n\n    this.addresses = [", "\n    this.addresses = [", 1)

          old_sync = """    this.isInitialized = true;\n\n    // Connect to MongoDB and synchronize overrides\n    mongoService.connect().then(connected => {\n      if (connected) {\n        mongoService.syncWithStore(this).catch(err => {\n          console.warn('[Store] MongoDB background hydration error:', err);\n        });\n      }\n    }).catch(() => {});"""
          new_sync = """    // Mark initialization complete, but keep the readiness promise pending until\n    // MongoDB persistence has been hydrated. API requests wait on `db.ready`,\n    // preventing a cold Lambda from serving seed-only data before cloud tombstones\n    // and overrides are applied.\n    this.isInitialized = true;\n    try {\n      const summary = await mongoService.syncWithStore(this);\n      if (summary.loaded || summary.seeded) {\n        console.log('[Store] MongoDB startup hydration complete:', summary.summary);\n      }\n    } catch (err) {\n      console.warn('[Store] MongoDB startup hydration error:', err);\n    }"""
          if old_sync not in s:
              raise SystemExit('startup Mongo sync block not found')
          s = s.replace(old_sync, new_sync, 1)

          p.write_text(s)
          PY

      - name: Patch API readiness gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/server/app.ts')
          s = p.read_text()
          if "import { db } from './db/store.js';" not in s:
              s = s.replace(
                  "import { createSeoMiddleware } from './middleware/seoCrawlerMiddleware.js';\n",
                  "import { createSeoMiddleware } from './middleware/seoCrawlerMiddleware.js';\nimport { db } from './db/store.js';\n",
                  1
              )
          marker = "app.use(express.urlencoded({ extended: true, limit: '10mb' }));\n"
          gate = """\n// Wait for the database store to finish cloud hydration before serving API requests.\n// This prevents Vercel cold starts from returning seed-only data before MongoDB\n// tombstones and persisted overrides have been merged into memory.\napp.use('/api', async (_req, _res, next) => {\n  try {\n    await db.ready;\n    next();\n  } catch (err) {\n    next(err);\n  }\n});\n"""
          if gate.strip() not in s:
              if marker not in s:
                  raise SystemExit('app middleware marker not found')
              s = s.replace(marker, marker + gate, 1)
          p.write_text(s)
          PY

      - name: Patch admin catalog refreshes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/client/pages/AdminDashboardPage.tsx')
          s = p.read_text()

          marker = """  useEffect(() => {\n    if (activeTab === 'products') {\n"""
          helper = """  const refreshCatalogView = async () => {\n    await fetchAdminCatalog(\n      catalogPage,\n      catalogLimit,\n      adminSearch,\n      catalogCategory,\n      catalogBrand,\n      catalogStockFilter,\n      catalogSortBy\n    );\n  };\n\n"""
          if helper.strip() not in s:
              if marker not in s:
                  raise SystemExit('catalog effect marker not found')
              s = s.replace(marker, helper + marker, 1)

          old = """      if (editingProduct) {\n        const res = await api.updateProduct(editingProduct.id, payload);\n        if (res.success) {\n          showToast(`Product \"${prodName}\" updated successfully!`, 'success');\n          broadcastSync('PRODUCT_UPDATED', { product: res.data, action: 'update' });\n        }\n      } else {\n        const res = await api.createProduct(payload);\n        if (res.success) {\n          showToast(`New product \"${prodName}\" added to catalog!`, 'success');\n          broadcastSync('PRODUCT_UPDATED', { product: res.data, action: 'create' });\n        }\n      }\n      setIsProductModalOpen(false);\n      await loadAllAdminData();\n      await fetchAdminCatalog(catalogPage, catalogLimit, adminSearch, catalogCategory, catalogBrand, catalogStockFilter, catalogSortBy);"""
          new = """      let savedProduct: Product | null = null;\n      if (editingProduct) {\n        const res = await api.updateProduct(editingProduct.id, payload);\n        if (res.success) {\n          savedProduct = ((res as any).data || { ...editingProduct, ...payload }) as Product;\n          showToast(`Product \"${prodName}\" updated successfully!`, 'success');\n          broadcastSync('PRODUCT_UPDATED', { product: savedProduct, action: 'update' });\n        }\n      } else {\n        const res = await api.createProduct(payload);\n        if (res.success) {\n          savedProduct = (res as any).data as Product;\n          showToast(`New product \"${prodName}\" added to catalog!`, 'success');\n          broadcastSync('PRODUCT_UPDATED', { product: savedProduct, action: 'create' });\n        }\n      }\n      setIsProductModalOpen(false);\n\n      // Update the visible row immediately, then re-fetch using the exact current\n      // page/search/filter state instead of resetting the catalog to page 1.\n      if (savedProduct?.id) {\n        if (editingProduct) {\n          setProducts(prev => prev.map(p => p.id === savedProduct!.id ? { ...p, ...savedProduct } : p));\n        } else {\n          setProducts(prev => [savedProduct!, ...prev]);\n        }\n      }\n      await refreshCatalogView();"""
          if old not in s:
              raise SystemExit('handleSaveProduct block not found')
          s = s.replace(old, new, 1)

          s = s.replace("            loadAllAdminData();\n", "            await refreshCatalogView();\n", 1)
          s = s.replace("          loadAllAdminData();\n", "          await refreshCatalogView();\n", 1)

          old_cat = """      if (editingCategory) {\n        const res = await api.updateAdminCategory(editingCategory.id, payload);\n        if (res.success) {\n          showToast(`Category \"${catName}\" updated successfully!`, 'success');\n          broadcastSync('CATEGORY_UPDATED', { category: res.data, action: 'update' });\n        }\n      } else {\n        const res = await api.createAdminCategory(payload);\n        if (res.success) {\n          showToast(`New category \"${catName}\" created!`, 'success');\n          broadcastSync('CATEGORY_UPDATED', { category: res.data, action: 'create' });\n        }\n      }\n      setIsCategoryModalOpen(false);\n      loadAllAdminData();"""
          new_cat = """      if (editingCategory) {\n        const res = await api.updateAdminCategory(editingCategory.id, payload);\n        if (res.success) {\n          const saved = ((res as any).data || { ...editingCategory, ...payload }) as Category;\n          setCategories(prev => prev.map(c => c.id === editingCategory.id ? { ...c, ...saved } : c));\n          showToast(`Category \"${catName}\" updated successfully!`, 'success');\n          broadcastSync('CATEGORY_UPDATED', { category: saved, action: 'update' });\n        }\n      } else {\n        const res = await api.createAdminCategory(payload);\n        if (res.success) {\n          const saved = (res as any).data as Category;\n          if (saved?.id) setCategories(prev => [...prev, saved]);\n          showToast(`New category \"${catName}\" created!`, 'success');\n          broadcastSync('CATEGORY_UPDATED', { category: saved, action: 'create' });\n        }\n      }\n      setIsCategoryModalOpen(false);"""
          if old_cat not in s:
              raise SystemExit('handleSaveCategory block not found')
          s = s.replace(old_cat, new_cat, 1)

          old_brand = """      if (editingBrand) {\n        const res = await api.updateAdminBrand(editingBrand.id, payload);\n        if (res.success) {\n          showToast(`Brand \"${brandName}\" updated successfully!`, 'success');\n          broadcastSync('CATEGORY_UPDATED', { brand: res.data });\n        }\n      } else {\n        const res = await api.createAdminBrand(payload);\n        if (res.success) {\n          showToast(`New brand \"${brandName}\" created!`, 'success');\n          broadcastSync('CATEGORY_UPDATED', { brand: res.data });\n        }\n      }\n      setIsBrandModalOpen(false);\n      loadAllAdminData();"""
          new_brand = """      if (editingBrand) {\n        const res = await api.updateAdminBrand(editingBrand.id, payload);\n        if (res.success) {\n          const saved = ((res as any).data || { ...editingBrand, ...payload }) as Brand;\n          setBrands(prev => prev.map(b => b.id === editingBrand.id ? { ...b, ...saved } : b));\n          showToast(`Brand \"${brandName}\" updated successfully!`, 'success');\n          broadcastSync('CATEGORY_UPDATED', { brand: saved });\n        }\n      } else {\n        const res = await api.createAdminBrand(payload);\n        if (res.success) {\n          const saved = (res as any).data as Brand;\n          if (saved?.id) setBrands(prev => [...prev, saved]);\n          showToast(`New brand \"${brandName}\" created!`, 'success');\n          broadcastSync('CATEGORY_UPDATED', { brand: saved });\n        }\n      }\n      setIsBrandModalOpen(false);"""
          if old_brand not in s:
              raise SystemExit('handleSaveBrand block not found')
          s = s.replace(old_brand, new_brand, 1)

          p.write_text(s)
          PY

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/db/store.ts src/server/app.ts src/client/pages/AdminDashboardPage.tsx .github/workflows/fix-persistence-cold-boot.yml
          git diff --cached --quiet || git commit -m "fix: persist cold-boot state and preserve admin catalog view [persistence-cold-boot-fixed]"
          git push
