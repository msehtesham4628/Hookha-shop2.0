name: Fix Staff Deletion Persistence

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch staff deletion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/server/routes/admin.routes.ts')
          text = path.read_text()
          old = "router.delete('/staff/:id', requirePermission('staff.update'), async (req: AuthenticatedRequest, res) => {"
          new = "router.delete('/staff/:id', requirePermission('staff.delete'), async (req: AuthenticatedRequest, res) => {"
          if old in text:
              text = text.replace(old, new, 1)
          marker = "  db.users.splice(targetStaffIndex, 1);\n"
          replacement = marker + "  // Persist the deletion so the staff account is not recreated after a restart.\n  db.deletePersisted('users', { id });\n"
          if marker not in text:
              raise SystemExit('Expected staff deletion marker not found')
          if "db.deletePersisted('users', { id });" not in text:
              text = text.replace(marker, replacement, 1)
          path.write_text(text)
          PY

      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-staff-delete.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/routes/admin.routes.ts .github/workflows/fix-staff-delete.yml
          git commit -m "fix: persist staff deletion" || exit 0
          git push